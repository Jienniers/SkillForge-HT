[project]
name = "skillforge"
version = "1.0.0"
description = "AI-powered 30-day programming learning platform."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
